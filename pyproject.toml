[project]
name = "timeguessr-ai"
version = "0.1.0"
description = "Timeguessr AI: predicting photo location (lat/lon) and year (1900-2026) using Vision Transformers, S2 geometry, FAISS, and OCR."
readme = "README.md"
authors = [
    { name = "Caleb Beversdorf", email = "cbeve2@illinois.edu" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Deep Learning & Vision Transformers (torch/torchvision installed via extras: cu128, rocm, xpu, cpu)
    "transformers>=4.49.0",
    "timm>=1.0.0",
    "accelerate>=1.0.0",
    "open-clip-torch>=2.29.0",
    "safetensors>=0.4.0",

    # Vector Retrieval (FAISS KNN Baseline)
    "faiss-cpu>=1.9.0",

    # Geospatial, Google S2 Geometry & Evaluation
    "s2sphere>=0.2.5",
    "s2cell>=1.8.0",
    "geopy>=2.4.0",
    "haversine>=2.8.0",
    "shapely>=2.0.0",
    "reverse-geocoder>=1.5.1",
    "pycountry>=24.6.1",

    # OCR & Language Detection Extension
    "easyocr>=1.7.2",
    "lingua-language-detector>=2.0.0",

    # Data Collection, Processing & Scientific Computing
    "numpy>=1.26.0,<2.3.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "pillow>=11.0.0",
    "opencv-python-headless>=4.10.0",
    "datasets>=3.0.0",
    "huggingface-hub>=0.27.0",
    "requests>=2.32.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "tqdm>=4.67.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",

    # Multimodal LLM Comparison & Visualization / Notebooks
    "google-genai>=1.0.0",
    "openai>=1.60.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
]
cu128 = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
]
rocm = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "pytorch-triton-rocm; sys_platform == 'linux'",
]
xpu = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "triton-xpu; sys_platform == 'linux' or sys_platform == 'win32'",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
        { extra = "rocm" },
        { extra = "xpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
    { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
    { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
pytorch-triton-rocm = [
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]
triton-xpu = [
    { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[project.scripts]
timeguessr-ai = "timeguessr_ai:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
