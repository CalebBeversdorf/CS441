[project]
name = "timeguessr-ai"
version = "0.1.0"
description = "Timeguessr AI: predicting photo location (lat/lon) and year (1900-2026) using Vision Transformers, S2 geometry, FAISS, and OCR."
readme = "README.md"
authors = [
    { name = "Caleb Beversdorf", email = "cbeve2@illinois.edu" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Deep Learning & Vision Transformers
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.49.0",
    "timm>=1.0.0",
    "accelerate>=1.0.0",
    "open-clip-torch>=2.29.0",
    "safetensors>=0.4.0",

    # Vector Retrieval (FAISS KNN Baseline)
    "faiss-cpu>=1.9.0",

    # Geospatial, Google S2 Geometry & Evaluation
    "s2sphere>=0.2.5",
    "s2cell>=1.8.0",
    "geopy>=2.4.0",
    "haversine>=2.8.0",
    "shapely>=2.0.0",
    "reverse-geocoder>=1.5.1",
    "pycountry>=24.6.1",

    # OCR & Language Detection Extension
    "easyocr>=1.7.2",
    "lingua-language-detector>=2.0.0",

    # Data Collection, Processing & Scientific Computing
    "numpy>=1.26.0,<2.3.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "pillow>=11.0.0",
    "opencv-python-headless>=4.10.0",
    "datasets>=3.0.0",
    "huggingface-hub>=0.27.0",
    "requests>=2.32.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "tqdm>=4.67.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",

    # Multimodal LLM Comparison & Visualization / Notebooks
    "google-genai>=1.0.0",
    "openai>=1.60.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
timeguessr-ai = "timeguessr_ai:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
